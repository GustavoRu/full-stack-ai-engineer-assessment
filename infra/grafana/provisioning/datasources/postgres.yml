apiVersion: 1

datasources:
  - name: DocQA PostgreSQL
    uid: docqa-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
